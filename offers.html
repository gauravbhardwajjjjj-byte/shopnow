<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ShopNow - Offers</title>

<style>
* {
    margin: 0;
    padding: 0;
    font-family: Poppins, sans-serif;
    box-sizing: border-box;
}

body, html {
    height: 100%;
    background: #f8f8f8;
}

/* NAVIGATION BAR (same as products page) */
.navbar {
    width: 100%;
    padding: 15px 40px;
    background: #ffffff;
    color: #333;
    display: flex;
    justify-content: space-between;
    align-items: center;
    box-shadow:0 3px 10px rgba(0,0,0,0.12);
}

.logo {
    font-size: 24px;
    font-weight: 700;
}

.logo span { color: #ff0077; }

.nav-links {
    list-style: none;
    display: flex;
    gap: 25px;
}

.nav-links a {
    color: #333;
    text-decoration: none;
    font-size: 16px;
    transition: 0.3s;
    font-weight: 500;
}

.nav-links a:hover,
.nav-links .active {
    color: #ff0077;
}

.cart {
    font-size: 18px;
    cursor: pointer;
}

/* HERO OFFER SECTION */
.hero-offer {
    height: 55vh;
    background: linear-gradient(to right, #ff0077, #ffc300);
    color: white;
    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;
    text-align: center;
    padding: 20px;
}

.hero-offer h1 {
    font-size: 48px;
    letter-spacing: 1px;
}

.hero-offer p {
    font-size: 18px;
    margin: 15px 0;
}

.shop-btn {
    background: #ffffff;
    color:#ff0077;
    border: none;
    padding: 12px 25px;
    font-size: 18px;
    cursor: pointer;
    border-radius: 5px;
    transition: 0.3s;
}

.shop-btn:hover {
    background: #ffe5f2;
}

/* SCROLLING IMAGES FIXED */
.scroller-box {
    width: 100%;
    overflow: hidden;
    background: #fff;
    padding: 20px 0;
}

.scroller-track {
    display: flex;
    gap: 25px;
    width: calc(300px * 8);   /* Force wide track */
    animation: scroll-left 18s linear infinite;
}

.scroller-track img {
    width: 300px;
    height: 250px;
    border-radius: 12px;
    object-fit: cover;
    transition: 0.3s;
}

.scroller-track img:hover {
    transform: scale(1.05);
}

@keyframes scroll-left {
    0% { transform: translateX(0); }
    100% { transform: translateX(-50%); }
}

/* OFFERS GRID */
.offers {
    padding: 60px 40px;
    text-align: center;
}

.offers h2 {
    font-size: 32px;
    margin-bottom: 40px;
}

.offer-grid {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(260px, 1fr));
    gap: 25px;
}

.offer-card {
    background: #fff;
    border-radius: 10px;
    overflow: hidden;
    box-shadow: 0 4px 10px rgba(0,0,0,0.1);
    transition: 0.3s;
}

.offer-card:hover {
    transform: translateY(-8px);
}

.offer-card img {
    width: 100%;
    height: 270px;
    object-fit: cover;
}

.offer-info {
    padding: 18px;
}

.offer-info h3 {
    font-size: 20px;
}

.offer-info p {
    color: #ff5722;
    font-size: 16px;
    margin: 10px 0;
}

.offer-btn {
    background: #ff0077;
    color: white;
    border: none;
    padding: 10px 18px;
    cursor: pointer;
    border-radius: 5px;
    transition: 0.3s;
}

.offer-btn:hover {
    background: #d10064;
}

/* RESPONSIVE */
@media (max-width: 768px) {
    .hero-offer h1 { font-size: 32px; }
    .scroller-track img { height: 110px; }
    .nav-links { gap:15px; }
}
</style>

</head>
