<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mini e-Commerce Store</title>
    <link rel="stylesheet" href="style.css">
	<style>
	* {
    margin: 0;
    padding: 0;
    font-family: "Poppins", sans-serif;
    box-sizing: border-box;
}

body {
    background: #f5f5f7;
}

/* NAVBAR */
.navbar {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 18px 40px;
    background: white;
    box-shadow: 0 3px 10px rgba(0,0,0,0.1);
    position: sticky;
    top: 0;
    z-index: 999;
}

.logo {
    font-size: 26px;
    font-weight: 700;
}

.logo span {
    color: #ff0077;
}

.nav-links {
    display: flex;
    gap: 25px;
    list-style: none;
}

.nav-links a {
    text-decoration: none;
    color: #333;
    font-weight: 500;
}

.nav-links a:hover {
    color: #ff0077;
}

/* CART */
.cart {
    font-size: 20px;
    cursor: pointer;
}

/* MOBILE MENU */
.menu-toggle {
    display: none;
    font-size: 28px;
    cursor: pointer;
}

/* HERO */
.hero {
    height: 40vh;
    background: linear-gradient(to right, #ff0077, #ffc300);
    color: white;
    padding: 70px;
    text-align: left;
}

.hero h1 {
    font-size: 50px;
}

.hero p {
    font-size: 20px;
    margin: 10px 0;
}

/* SCROLLING IMAGES FIXED */
.scroller-box {
    width: 100%;
    overflow: hidden;
    background: #fff;
    padding: 20px 0;
}

.scroller-track {
    display: flex;
    gap: 25px;
    width: calc(300px * 8);   /* Force wide track */
    animation: scroll-left 18s linear infinite;
}

.scroller-track img {
    width: 300px;
    height: 250px;
    border-radius: 12px;
    object-fit: cover;
    transition: 0.3s;
}

.scroller-track img:hover {
    transform: scale(1.05);
}

@keyframes scroll-left {
    0% { transform: translateX(0); }
    100% { transform: translateX(-50%); }
}

/* Make it responsive */
@media (max-width: 768px) {
    .scroll-container img {
        width: 200px;
        height: 150px;
    }
}

.shop-btn {
    padding: 12px 25px;
    border: none;
    background: white;
    color: #ff0077;
    border-radius: 30px;
    font-size: 18px;
    cursor: pointer;
}

.shop-btn:hover {
    background: #ffe6f0;
}

/* PRODUCT SECTION */
.products {
    padding: 50px;
    text-align: center;
}

.product-grid {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
    gap: 25px;
    margin-top: 20px;
}

.product-card {
    background: white;
    padding: 20px;
    border-radius: 15px;
    box-shadow: 0 5px 15px rgba(0,0,0,0.1);
    transition: transform .2s;
}

.product-card:hover {
    transform: translateY(-5px);
}

.product-card img {
    width: 100%;
    height: 220px;       /* SAME HEIGHT FOR ALL IMAGES */
    object-fit: cover;   /* CROPS PERFECTLY */
    border-radius: 10px;
}
.product-card h3 {
    margin: 10px 0;
}

.product-card button {
    padding: 10px 20px;
    background: #ff0077;
    color: white;
    border: none;
    border-radius: 20px;
    cursor: pointer;
    margin-top: 10px;
}

.product-card button:hover {
    background: #d10064;
}

/* TOTAL COST BOX */
.total-box {
    margin-top: 30px;
    font-size: 22px;
}

/* RESPONSIVE NAV MENU */
@media (max-width: 768px) {

    .nav-links {
        display: none;
        position: absolute;
        top: 70px;
        right: 40px;
        background: white;
        flex-direction: column;
        padding: 20px;
        border-radius: 10px;
        box-shadow: 0 5px 10px rgba(0,0,0,0.2);
    }

    .menu-toggle {
        display: block;
    }
}

	</style>
</head>
