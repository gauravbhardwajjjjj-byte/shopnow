<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Mini e-Commerce - One Screen</title>
<style>
* {margin:0; padding:0; font-family:Poppins,sans-serif; box-sizing:border-box;}
body, html {
    min-height: 100%;
    overflow-y: auto;     /* allow vertical scrolling */
    overflow-x: hidden;   /* hide horizontal scroll only */
}
.navbar {display:flex; justify-content:space-between; align-items:center; padding:10px 30px; background:white; box-shadow:0 3px 10px rgba(0,0,0,0.1);}
.logo {font-size:22px; font-weight:700;}
.logo span {color:#ff0077;}
.nav-links {display:flex; gap:20px; list-style:none;}
.nav-links a {text-decoration:none; color:#333; font-weight:500;}
.nav-links a:hover {color:#ff0077;}
.cart {font-size:18px; cursor:pointer;}
.menu-toggle {display:none; font-size:28px; cursor:pointer;}

/* Main Container */
.main-container {display:flex; flex-direction:column; height:100vh;}

/* HERO SECTION */
.hero {flex:1; background:linear-gradient(to right,#ff0077,#ffc300); color:white; display:flex; flex-direction:column; justify-content:center; align-items:center; text-align:center; padding:20px;}
.hero h1 {font-size:36px;}
.hero p {font-size:18px; margin:10px 0;}

/* SCROLLING IMAGES FIXED */
.scroller-box {
    width: 100%;
    overflow: hidden;
    background: #fff;
    padding: 20px 0;
}

.scroller-track {
    display: flex;
    gap: 25px;
    width: calc(300px * 8);   /* Force wide track */
    animation: scroll-left 18s linear infinite;
}

.scroller-track img {
    width: 300px;
    height: 250px;
    border-radius: 12px;
    object-fit: cover;
    transition: 0.3s;
}

.scroller-track img:hover {
    transform: scale(1.05);
}

@keyframes scroll-left {
    0% { transform: translateX(0); }
    100% { transform: translateX(-50%); }
}
/* PRODUCTS SECTION */
.products {flex:1.4; display:flex; flex-direction:column; justify-content:center; align-items:center; padding:10px; overflow-x:auto;}
.product-grid {display:flex; gap:15px; overflow-x:auto; padding:5px;}
.product-card {background:white; padding:10px; border-radius:10px; box-shadow:0 5px 10px rgba(0,0,0,0.1); min-width:180px; flex-shrink:0; transition:transform 0.3s; cursor:pointer;}
.product-card:hover {transform:scale(1.05);}
.product-card img {
    width: 200px;
    height: 220px;       /* SAME HEIGHT FOR ALL IMAGES */
    object-fit: cover;   /* CROPS PERFECTLY */
    border-radius: 10px;
}
.product-card h3 {margin:5px 0; font-size:16px;}
.product-card p {font-size:14px; margin:5px 0;}
.product-card button {padding:5px 10px; background:#ff0077; color:white; border:none; border-radius:15px; cursor:pointer; font-size:14px; margin-top:5px;}
.product-card button:hover {background:#d10064;}

/* TOTAL COST BUTTON */
.total-box {
    margin-top:10px;
    font-size:16px;
    color:white;
    background:#ff0077;
    padding:10px 20px;
    border-radius:20px;
    cursor:pointer;
    transition:background 0.3s, transform 0.2s;
    text-align:center;
}
.total-box:hover {
    background:#d10064;
    transform:scale(1.05);
}

/* FOOTER */
footer {background:#222; color:#fff; text-align:center; padding:10px; font-size:14px;}
footer a {color:#ff0077; text-decoration:none; margin:0 5px;}
footer a:hover {color:#fff;}

/* RESPONSIVE FOR MOBILE */
@media(max-width:768px){
    .navbar {flex-direction:column; align-items:flex-start;}
    .nav-links {flex-wrap:wrap;}
    .hero h1 {font-size:28px;}
    .hero p {font-size:16px;}
}
</style>
</head>
<body>

<nav class="navbar">
    <div class="logo">Shop<span>Now</span></div>
    <ul class="nav-links">
        <li><a href="index.html">Home</a></li>
        <li><a href="product.html">Products</a></li>
        <li><a href="offers.html">Offers</a></li>
        <li><a href="contactshop.html">Contact</a></li>
    </ul>
    <div class="cart">🛒 <span id="cart-count">0</span></div>
</nav>

<div class="main-container">
    <!-- HERO -->
    <section class="hero">
        <h1>Our Products</h1>
        <p>Shop exclusive items—all in one screen!</p>
    </section>

    <!-- SCROLLING IMAGES RIGHT → LEFT -->
<!-- SCROLLING IMAGES RIGHT → LEFT -->
<div class="scroller-box">
    <div class="scroller-track">
        <img src="https://img.tatacliq.com/images/i10/437Wx649H/MP000000016613560_437Wx649H_202302211708341.jpeg">
        <img src="https://m.media-amazon.com/images/I/81UjoIfQ6iL._AC_SL1500_.jpg">
        <img src="https://img.freepik.com/premium-photo/minimalist-w…-headphones-with-4k-hd-technology_899449-8766.jpg">
        <img src="https://img.freepik.com/premium-photo/different-color-small-handbags_1059430-72866.jpg">
        <!-- Duplicate for infinite loop -->
        <img src="https://img.tatacliq.com/images/i10/437Wx649H/MP000000016613560_437Wx649H_202302211708341.jpeg">
        <img src="https://m.media-amazon.com/images/I/81UjoIfQ6iL._AC_SL1500_.jpg">
        <img src="https://img.freepik.com/premium-photo/minimalist-w…-headphones-with-4k-hd-technology_899449-8766.jpg">
        <img src="https://img.freepik.com/premium-photo/different-color-small-handbags_1059430-72866.jpg">
    </div>
</div>

    <!-- PRODUCTS -->
    <section class="products">
        <div class="product-grid">
            <div class="product-card">
                <img src="https://hips.hearstapps.com/hmg-prod/images/run-nike-running-shoes-1661870227.jpg" alt="Casual Sneakers">
                <h3>Casual Sneakers</h3>
                <p>₹1500</p>
                <button onclick="addToCart(40)">Add to Cart</button>
            </div>

            <div class="product-card">
                <img src="https://m.media-amazon.com/images/I/71AcGKTe9+L._AC_SL1500_.jpg" alt="Smart Watch">
                <h3>Smart Watch</h3>
                <p>₹3000</p>
                <button onclick="addToCart(55)">Add to Cart</button>
            </div>

            <div class="product-card">
                <img src="https://cdn.pixabay.com/photo/2020/04/19/16/33/headphones-5064411_1280.jpg" alt="Headphones">
                <h3>Headphones</h3>
                <p>₹1099</p>
                <button onclick="addToCart(30)">Add to Cart</button>
            </div>

            <div class="product-card">
                <img src="https://alexnld.com/wp-content/uploads/2018/12/9eae191c-cf2e-4871-863d-6e28db43777a.jpg" alt="Leather Bag">
                <h3>Leather Bag</h3>
                <p>₹1259</p>
                <button onclick="addToCart(65)">Add to Cart</button>
            </div>
        </div>

        <div class="total-box" onclick="alert('Total: ₹' + totalCost)">
            Total Cost: $<span id="total-cost">0</span>
        </div>
    </section>
</div>
<script>
let cartCount = 0;
let totalCost = 0;
function addToCart(price){
    cartCount++;
    totalCost += price;
    document.getElementById("cart-count").textContent = cartCount;
    document.getElementById("total-cost").textContent = totalCost;
}
</script>

</body>
</html>
