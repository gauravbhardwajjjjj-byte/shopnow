<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ShopNow - Contact Us</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Poppins, sans-serif;
}

body{
    background:#f8f8f8;
}

/* NAVIGATION BAR (same theme as offers page) */
.navbar{
    width:100%;
    padding:15px 40px;
    background:white;
    color:#333;
    display:flex;
    justify-content:space-between;
    align-items:center;
    box-shadow:0 3px 10px rgba(0,0,0,0.1);
}

.logo{
    font-size:24px;
    font-weight:700;
}
.logo span{ color:#ff0077; }

.nav-links{
    list-style:none;
    display:flex;
    gap:25px;
}
.nav-links a{
    text-decoration:none;
    color:#333;
    font-weight:500;
    transition:0.3s;
}
.nav-links a:hover,
.nav-links .active{
    color:#ff0077;
}

.cart{
    font-size:18px;
    cursor:pointer;
}

/* CONTACT HERO */
.contact-hero{
    height:45vh;
    background:linear-gradient(to right, #ff0077, #ffc300);
    color:white;
    display:flex;
    justify-content:center;
    align-items:center;
    flex-direction:column;
    text-align:center;
}
.contact-hero h1{
    font-size:46px;
}
.contact-hero p{
    font-size:18px;
    margin-top:10px;
}

/* CONTACT Page Layout */
.contact-container{
    padding:60px 40px;
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:40px;
}

/* LEFT — FORM */
.contact-form{
    background:#fff;
    padding:25px;
    border-radius:10px;
    box-shadow:0 5px 15px rgba(0,0,0,0.1);
}
.contact-form h2{
    font-size:26px;
    margin-bottom:20px;
    color:#ff0077;
}

.contact-form input,
.contact-form textarea{
    width:100%;
    padding:12px;
    margin:10px 0;
    border-radius:5px;
    border:1px solid #ccc;
    font-size:15px;
    outline:none;
    transition:0.3s;
}
.contact-form input:focus,
.contact-form textarea:focus{
    border-color:#ff0077;
}

.contact-btn{
    background:#ff0077;
    color:white;
    border:none;
    padding:12px 20px;
    cursor:pointer;
    border-radius:5px;
    font-size:16px;
    transition:0.3s;
}
.contact-btn:hover{
    background:#d10064;
}

/* RIGHT — CONTACT INFO + MAP */
.contact-info-box{
    display:flex;
    flex-direction:column;
    gap:25px;
}

.info-card{
    background:white;
    padding:20px;
    border-radius:10px;
    box-shadow:0 5px 15px rgba(0,0,0,0.1);
}
.info-card h3{
    font-size:20px;
    margin-bottom:6px;
}
.info-card p{
    color:#555;
}

.map{
    width:100%;
    height:250px;
    border-radius:10px;
    border:none;
}


/* RESPONSIVE */
@media(max-width:900px){
    .contact-container{
        grid-template-columns:1fr;
        padding:40px 20px;
    }
}
</style>
</head>

<body>

<!-- NAVIGATION -->
<nav class="navbar">
    <div class="logo">Shop<span>Now</span></div>

    <ul class="nav-links">
        <li><a href="index.html">Home</a></li>
        <li><a href="products.html">Products</a></li>
        <li><a href="offers.html">Offers</a></li>
        <li><a class="active" href="contactshop.html">Contact</a></li>
    </ul>

    <div class="cart">🛒</div>
</nav>

<!-- HERO -->
<section class="contact-hero">
    <h1>Contact Us</h1>
    <p>We’re here to help! Reach out anytime.</p>
</section>

<!-- CONTACT FORM + INFO -->
<section class="contact-container">

    <!-- LEFT FORM -->
    <div class="contact-form">
        <h2>Send Us a Message</h2>

        <input type="text" placeholder="Your Name">
        <input type="email" placeholder="Email Address">
        <input type="text" placeholder="Subject">
        <textarea rows="5" placeholder="Write your message..."></textarea>

        <button class="contact-btn">Send Message</button>
    </div>

    <!-- RIGHT INFO -->
    <div class="contact-info-box">

        <div class="info-card">
            <h3>📍 Address</h3>
            <p>123 Market Street, Mumbai, India</p>
        </div>

        <div class="info-card">
            <h3>📞 Phone</h3>
            <p>+91 98765 43210</p>
        </div>

        <div class="info-card">
            <h3>📧 Email</h3>
            <p>support@shopnow.com</p>
        </div>

        <iframe  
            class="map"
            src="https://www.google.com/maps/embed?pb=!1m18!1m12!1m3!1d241317.11609754132!2d72.74110165!3d19.0821978!2m3!1f0!2f0!3f0!3m2!1i1024!2i768!4f13.1!3m3!1m2!1s0x3be7c630f8c58dd7%3A0x8b62ddb29e0d990!2sMumbai!5e0!3m2!1sen!2sin!4v1694030489379"
            allowfullscreen>
        </iframe>

    </div>

</section>
</body>
</html>
